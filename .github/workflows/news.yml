# HoYoLAB 원신 공식 공지·이벤트·소식 → news/news.json (6시간마다 + 수동 실행). 쿠키 없이 공개 목록만 읽음
# Fork 사이트도 원본 사이트의 news 파일을 읽으므로 원본에서만 실행
name: news-sync
on:
  workflow_dispatch:
  schedule:
    - cron: '41 */6 * * *'
permissions:
  contents: write
concurrency:
  group: hoyolab-sync
  cancel-in-progress: false
jobs:
  news:
    if: github.repository == 'ts26072-ui/Genshin'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/news_sync.py news/news.json
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news/news.json
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -m "공식 소식 갱신"
          git push || { git pull --no-rebase --no-edit && git push; }
