# 공식 지도 그림·위치 자료를 받아 map/ 폴더에 올림 (수동 실행 + 매주 목요일)
name: build-map
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 4'
permissions:
  contents: write
jobs:
  map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow==11.0.0
      - run: python tools/build_map.py map
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add map
          git diff --cached --quiet || (git commit -m "지도 자료 갱신 (HoYoLAB 공식 지도)" && git push)
