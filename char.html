<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>캐릭터 정보 · 원신 파티 감정소</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="common.css?v=20261114a">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0e1320">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="파티 감정소">
<style>
/* 캐릭터 한 화면: 위는 캐릭터 머리 카드(역할별 점수·내 육성), 아래 탭 = 기존 페이지를 그 캐릭터만 보이게 넣은 것 */
.r5 { --rar: linear-gradient(160deg, #8a5a2b, #c48a3f); } .r4 { --rar: linear-gradient(160deg, #5a4a8a, #8a6ac4); }
.find { display: flex; gap: 8px; align-items: center; margin: 18px 0 14px; }
.find input { max-width: 280px; }
.hero { display: grid; grid-template-columns: auto 1fr; gap: 14px 18px; align-items: center; padding: 16px; border-radius: 14px; border: 1px solid var(--line);
  background: radial-gradient(120% 140% at 0% 0%, color-mix(in srgb, var(--c) 22%, transparent), transparent 60%), var(--surface); }
.hero .pic { width: 88px; height: 88px; border-radius: 16px; overflow: hidden; background: var(--rar); box-shadow: inset 0 -4px 0 var(--c); }
.hero .pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
.hero h1 { margin: 0; font-size: 26px; }
.hero .meta { color: var(--muted); font-size: 13.5px; margin-top: 2px; }
.hero .rl { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.hero .rl span { font-size: 12.5px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); }
.hero .rl span.xr { border-style: dashed; }
.hero .rl b { margin-left: 4px; color: var(--gold); }
.mine { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; padding-top: 12px; border-top: 1px solid var(--line); font-size: 13.5px; }
.mine .n { font-size: 22px; font-weight: 900; color: var(--gold); margin-right: 4px; }
.mine .acts { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }
.ctabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--line); margin: 18px 0 12px; position: sticky; top: 0; z-index: 5; background: var(--bg); }
.ctabs::-webkit-scrollbar { display: none; }
.ctabs button { font: inherit; font-weight: 700; font-size: 14px; color: var(--muted); background: none; border: 0; border-bottom: 2px solid transparent; padding: 11px 12px 9px; cursor: pointer; white-space: nowrap; }
.ctabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--gold); }
.pane iframe { width: 100%; height: 640px; border: 0; display: block; background: transparent; }
.pane .loading { color: var(--muted); font-size: 13px; padding: 10px 0; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 10px; }
.grid a { text-decoration: none; color: inherit; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; text-align: center; }
.grid a .pic { width: 62px; height: 62px; border-radius: 12px; overflow: hidden; background: var(--rar); box-shadow: inset 0 -3px 0 var(--c); position: relative; }
.grid a .pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
.grid a.own .pic::after { content: '보유'; position: absolute; top: 2px; right: 2px; font-size: 9.5px; font-weight: 800; background: var(--gold); color: #1b1b1b; border-radius: 999px; padding: 0 4px; }
.grid a:hover .pic { outline: 2px solid var(--gold); outline-offset: 1px; }
.grid h2 { grid-column: 1 / -1; font-size: 14px; margin: 10px 0 0; color: var(--muted); }
@media (max-width: 560px) { .hero { grid-template-columns: 64px 1fr; padding: 12px; } .hero .pic { width: 64px; height: 64px; } .hero h1 { font-size: 21px; } .mine .acts { margin-left: 0; } }
</style>
</head>
<body>
<script src="shell.js?v=20261114a"></script>
<div class="wrap">
  <div class="find">
    <input type="search" id="q" list="names" placeholder="캐릭터 이름으로 찾기" aria-label="캐릭터 찾기">
    <datalist id="names"></datalist>
  </div>
  <div id="main"></div>
  <p class="foot-note">한 화면에서 그 캐릭터의 점수·특성·추천 빌드·종결 스탯·재료를 모아 봅니다. 각 탭 내용은 티어표·도감·성유물 추천·종결 스탯·재료 파밍 페이지와 같은 계산이에요. 캐릭터 이미지 © HoYoverse — 이 사이트는 HoYoverse와 관련 없는 비상업 팬 도구입니다.</p>
</div>
<script src="chars.js?v=20261114a"></script>
<script>
const $ = s => document.querySelector(s);
const own = GP.roster(), MASTER = GP.appraisal();
const POSN = { main: '메인 딜러', sub: '서브 딜러', sup: '서포터' };
// 탭: [키, 이름, 넣을 페이지]
const TABS = [['tier', '점수 · 돌파', 'tier.html'], ['dex', '능력치 · 특성', 'dex.html'], ['guide', '추천 빌드', 'guide.html'], ['stats', '종결 스탯', 'stats.html'], ['farm', '재료', 'farm.html']];
const pic = id => { const u = GP.iconUrl(id); return u ? `<img src="${u}" alt="" loading="lazy" decoding="async">` : ''; };
const ids = Object.values(GP.DB).sort((a, b) => (!!own[b.id] - !!own[a.id]) || b.r - a.r || a.name.localeCompare(b.name, 'ko'));
$('#names').innerHTML = ids.map(d => `<option value="${GP.esc(d.name)}">`).join('');
$('#q').addEventListener('change', e => { const d = ids.find(x => x.name === e.target.value.trim()) || ids.find(x => x.name.includes(e.target.value.trim())); if (d) { location.hash = d.id; e.target.value = ''; e.target.blur(); } });

let frames = {};
function parse() { const [id, t] = decodeURIComponent(location.hash.slice(1)).split('/'); return { id: GP.DB[id] ? id : null, tab: TABS.some(x => x[0] === t) ? t : 'tier' }; }

function picker() {
  const mine = ids.filter(d => own[d.id]), rest = ids.filter(d => !own[d.id]);
  const tile = d => `<a href="#${d.id}" class="${own[d.id] ? 'own ' : ''}r${d.r}" style="--c:var(--${d.el})"><span class="pic">${pic(d.id)}</span>${GP.esc(d.name)}</a>`;
  $('#main').innerHTML = `<h1 style="margin:0 0 4px"><span class="star">✦</span> 캐릭터 정보</h1><p class="sub" style="margin-bottom:14px">캐릭터를 고르면 점수·특성·추천 빌드·종결 스탯·재료를 한 화면에서 볼 수 있어요.</p>
    <div class="grid">${mine.length ? `<h2>내 캐릭터 ${mine.length}명</h2>${mine.map(tile).join('')}<h2>나머지</h2>` : ''}${rest.map(tile).join('')}</div>`;
  document.title = '캐릭터 정보 · 원신 파티 감정소';
}

function hero(id) {
  const d = GP.DB[id], c = own[id], m = MASTER[id], sls = GP.slotsAt(id, c ? c.cons : null);
  const roles = sls.slice().sort((a, b) => b.perf - a.perf).map(s => `<span${s.xrole ? ' class="xr" title="티어표에 이 역할 평가가 없어 추정한 값"' : ''}>${POSN[s.pos]}<b>${s.tier || ''} ${s.perf}${s.xrole ? ' 추정' : ''}</b></span>`).join('');
  const mine = c ? `<div class="mine"><span>내 캐릭터 · <b>C${c.cons}</b> · Lv.${c.lv}${c.wn ? ' · ' + GP.esc(c.wn) : ''}</span>
      ${m ? `<span><span class="n">${m.o}</span>OVR</span><span><span class="n">${m.s}</span>육성</span>` : ''}
      <div class="acts"><a class="btn sm" href="dex.html#cmp=me:${id}">비교에 넣기</a><a class="btn sm" href="rate.html#${id}">성유물 감정</a><a class="btn sm" href="index.html#roster">내 캐릭터에서 고치기</a></div></div>`
    : `<div class="mine"><span class="muted">아직 없는 캐릭터예요. 점수는 ${'C0'} 기준이에요.</span><div class="acts"><a class="btn sm" href="dex.html#cmp=${id}">비교에 넣기</a></div></div>`;
  return `<section class="hero r${d.r}" style="--c:var(--${d.el})"><div class="pic">${pic(id)}</div>
    <div><h1>${GP.esc(d.name)}</h1><div class="meta">${'★'.repeat(d.r)} · ${GP.EL[d.el]} · ${GP.WPN[d.wp] || ''} · ${d.roles.map(r => GP.ROLE[r]).join(' / ')}</div><div class="rl">${roles}</div></div>${mine}</section>`;
}

function show() {
  const { id, tab } = parse();
  if (!id) { frames = {}; return picker(); }
  const d = GP.DB[id];
  document.title = `${d.name} · 캐릭터 정보`;
  if ($('#main').dataset.id !== id) {
    frames = {};
    $('#main').dataset.id = id;
    $('#main').innerHTML = hero(id) + `<div class="ctabs" role="tablist" aria-label="${GP.esc(d.name)} 정보">${TABS.map(([k, n]) => `<button type="button" role="tab" data-t="${k}">${n}</button>`).join('')}</div><div id="panes"></div>`;
    window.scrollTo(0, 0);
  }
  for (const b of document.querySelectorAll('.ctabs [data-t]')) b.setAttribute('aria-selected', b.dataset.t === tab);
  if (!frames[tab]) {
    const [, n, page] = TABS.find(x => x[0] === tab), div = document.createElement('div');
    div.className = 'pane'; div.dataset.t = tab;
    div.innerHTML = `<iframe title="${GP.esc(d.name)} ${n}" src="${page}?embed=1#${id}"></iframe>`;
    $('#panes').append(div); frames[tab] = div;
  }
  for (const [k, el] of Object.entries(frames)) el.hidden = k !== tab;
}
document.addEventListener('click', e => {
  const b = e.target.closest('.ctabs [data-t]'); if (!b) return;
  const { id } = parse();
  history.replaceState(null, '', `#${id}/${b.dataset.t}`); show();
});
// 안쪽 페이지 높이에 맞춤
addEventListener('message', e => {
  if (!e.data || e.data.type !== 'gp-h') return;
  for (const f of document.querySelectorAll('.pane iframe')) if (f.contentWindow === e.source) f.style.height = Math.max(200, e.data.h + 6) + 'px';
});
addEventListener('hashchange', () => { if (!parse().id) $('#main').dataset.id = ''; show(); });
document.addEventListener('error', e => { if (e.target.tagName === 'IMG') e.target.remove(); }, true);
show();
</script>
<script>if ('serviceWorker' in navigator && /github\.io$|^localhost$|^127\.0\.0\.1$/.test(location.hostname)) navigator.serviceWorker.register('sw.js').catch(() => {});</script>
</body>
</html>
